<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    La dirección base la pone la compilación (--base-href), por ejemplo /app/
    en la vista previa local o /abograde-prueba/app/ al publicar.
  -->
  <base href="/abograde-prueba/app/">

  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="AboGrade: practica para el examen de grado">
  <!--
    Seguridad (la misma idea de Ruy Chess): la página solo ejecuta código propio
    (el motor de dibujo va incluido: se compila con --no-web-resources-cdn y --csp)
    y solo se conecta a nuestra base de datos en Supabase y a Google Fonts
    (tipografía Nunito y letras de respaldo). Si cambia el proyecto de Supabase,
    hay que cambiar la dirección aquí.
    GitHub Pages no permite cabeceras propias: al pasar a Netlify o similar, agregar
    también frame-ancestors 'none' (que no funciona desde esta etiqueta).
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://rysxjukisuisnqdiqfbi.supabase.co https://fonts.gstatic.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AboGrade">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AboGrade</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Fondo mientras carga (mismo verde pizarra de la app). */
    html, body { margin: 0; height: 100%; background: #2F4A45; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
